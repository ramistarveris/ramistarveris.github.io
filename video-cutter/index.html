<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#101114">
    <meta name="description" content="動画をブラウザ内だけでカットできるシンプルな動画編集ツール">
    <title>Video Cutter</title>
    <script src="./js/theme.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/mediabunny@1.59.0/dist/bundles/mediabunny.cjs" crossorigin="anonymous"></script>
    <script defer src="./js/main.js"></script>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div>
                <a class="back-link" href="../index.html">← My Projects</a>
                <h1>Video Cutter</h1>
            </div>
            <button class="icon theme-toggle" id="themeToggle" type="button" title="Switch to light mode" aria-label="Switch to light mode">
                <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
                </svg>
                <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M20.9 13.2A9 9 0 0 1 10.8 3.1 9 9 0 1 0 20.9 13.2Z"></path>
                </svg>
            </button>
        </header>

        <main>
            <p class="description">動画を選んで、残したい範囲を指定して書き出します。動画ファイル自体はサーバーへ送信しません。</p>

            <section class="panel upload-panel" id="uploadPanel" aria-label="動画を追加">
                <label class="drop-zone" id="dropZone" for="fileInput">
                    <input id="fileInput" type="file" accept="video/*,.mp4,.m4v,.mov,.webm,.mkv" hidden>
                    <span class="drop-icon" aria-hidden="true">＋</span>
                    <strong>動画を追加</strong>
                    <span>ドラッグ&amp;ドロップ または クリック</span>
                </label>
                <p class="privacy-note">処理はこのブラウザ内で実行されます。</p>
            </section>

            <section class="editor" id="editor" hidden aria-label="動画編集">
                <div class="video-card">
                    <div class="video-frame">
                        <video id="video" preload="metadata" playsinline controls></video>
                    </div>

                    <div class="file-row">
                        <div class="file-copy">
                            <strong id="fileName"></strong>
                            <span id="fileMeta"></span>
                        </div>
                        <button id="replaceButton" type="button">動画を変更</button>
                    </div>
                </div>

                <section class="panel trim-panel" aria-labelledby="trimTitle">
                    <div class="section-head">
                        <div>
                            <p class="eyebrow">CUT</p>
                            <h2 id="trimTitle">残す範囲</h2>
                        </div>
                        <strong class="clip-duration" id="clipDuration">0:00.00</strong>
                    </div>

                    <div class="timeline-wrap">
                        <div class="timeline-track" aria-hidden="true">
                            <div class="timeline-selection" id="timelineSelection"></div>
                            <div class="playhead" id="playhead"></div>
                        </div>
                        <input class="range range-start" id="startRange" type="range" min="0" max="1" value="0" step="0.01" aria-label="開始位置">
                        <input class="range range-end" id="endRange" type="range" min="0" max="1" value="1" step="0.01" aria-label="終了位置">
                    </div>

                    <div class="time-grid">
                        <label class="time-field">
                            <span>開始</span>
                            <div class="time-input-row">
                                <input id="startInput" type="text" inputmode="decimal" value="0:00.00" autocomplete="off" spellcheck="false">
                                <button id="setStartButton" type="button">現在位置</button>
                            </div>
                        </label>
                        <label class="time-field">
                            <span>終了</span>
                            <div class="time-input-row">
                                <input id="endInput" type="text" inputmode="decimal" value="0:00.00" autocomplete="off" spellcheck="false">
                                <button id="setEndButton" type="button">現在位置</button>
                            </div>
                        </label>
                    </div>

                    <div class="preview-actions">
                        <button id="previewButton" type="button">選択範囲を再生</button>
                        <button id="resetRangeButton" type="button">範囲をリセット</button>
                    </div>
                </section>

                <section class="panel export-panel" aria-labelledby="exportTitle">
                    <div class="section-head export-head">
                        <div>
                            <p class="eyebrow">EXPORT</p>
                            <h2 id="exportTitle">書き出し</h2>
                        </div>
                        <span class="format-badge" id="formatBadge">MP4</span>
                    </div>

                    <p class="export-note">開始位置が 0 秒以外の場合、正確なカットのため再エンコードされることがあります。</p>

                    <div class="progress-block" id="progressBlock" hidden>
                        <div class="progress-copy">
                            <span id="progressLabel">準備中…</span>
                            <span id="progressPercent">0%</span>
                        </div>
                        <progress id="progressBar" max="1" value="0"></progress>
                    </div>

                    <div class="export-actions">
                        <button class="primary-button" id="exportButton" type="button">選択範囲を書き出す</button>
                        <button id="cancelButton" type="button" hidden>キャンセル</button>
                    </div>
                    <p class="status-text" id="statusText" aria-live="polite"></p>
                </section>
            </section>
        </main>
    </div>

    <noscript>
        <p class="noscript-notice">JavaScriptを有効にしてください。</p>
    </noscript>
</body>
</html>
