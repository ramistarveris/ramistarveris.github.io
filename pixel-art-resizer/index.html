<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="dark light">
        <meta name="theme-color" content="#101114">
        <meta name="description" content="ピクセル画像を解像度を下げずにサイズ変更">
        <title>Pixel Art Resizer</title>
        <script src="./js/theme.js"></script>
        <link rel="stylesheet" href="./css/style.css">
        <script defer src="./js/main.js"></script>
    </head>
    <body>
        <div class="shell">
            <header class="topbar">
                <h1>Pixel Art Resizer</h1>
                <div class="actions">
                    <button class="icon theme-toggle" id="themeToggle" type="button" title="Switch to light mode" aria-label="Switch to light mode">
                        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
                        </svg>
                        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M20.9 13.2A9 9 0 0 1 10.8 3.1 9 9 0 1 0 20.9 13.2Z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <main>
                <p class="description">ピクセル画像を解像度を下げずにサイズ変更</p>

                <section class="input-section" aria-label="Image input">
                    <label class="drop-zone" id="drop-zone" for="file-input">
                        <input id="file-input" type="file" accept="image/*" multiple hidden>
                        <strong>画像を追加</strong>
                        <span>ドラッグ&amp;ドロップ または クリック</span>
                    </label>

                    <div class="toolbar">
                        <div class="toolbar-group">
                            <label for="batch-scale">倍率</label>
                            <select id="batch-scale"></select>
                            <button id="apply-batch" type="button">適用</button>
                        </div>
                        <div class="toolbar-actions">
                            <button class="primary-button" id="download-all" type="button" disabled>すべて保存</button>
                            <button id="clear-all" type="button" disabled>クリア</button>
                        </div>
                    </div>

                    <p class="status-text" id="status-text" aria-live="polite"></p>
                </section>

                <section class="gallery-section" aria-labelledby="gallery-title">
                    <div class="section-head">
                        <h2 id="gallery-title">画像なし</h2>
                        <p id="gallery-note"></p>
                    </div>

                    <div class="empty-state" id="empty-state">画像を追加してください</div>
                    <div class="gallery" id="gallery" aria-live="polite"></div>
                </section>
            </main>
        </div>

        <template id="card-template">
            <article class="image-card">
                <div class="card-top">
                    <div class="card-copy">
                        <p class="card-name"></p>
                        <p class="card-info"></p>
                    </div>
                    <button type="button" data-action="remove">削除</button>
                </div>

                <div class="card-controls">
                    <label class="field">
                        <span>倍率</span>
                        <select class="scale-select"></select>
                    </label>
                    <div class="size-info">
                        <span class="source-size"></span>
                        <span aria-hidden="true">→</span>
                        <strong class="output-size"></strong>
                    </div>
                </div>

                <div class="preview-frame">
                    <canvas class="preview-canvas"></canvas>
                </div>

                <div class="card-actions">
                    <button class="primary-button" type="button" data-action="download">PNG保存</button>
                </div>
            </article>
        </template>

        <noscript>
            <p class="noscript-notice">JavaScriptを有効にしてください。</p>
        </noscript>
    </body>
</html>
