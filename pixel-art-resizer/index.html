<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Art Resizer</title><link rel="stylesheet" href="./styles.css"></head>
<body><div class="page-shell"><nav class="site-nav"><a href="../index.html">← My Projects</a></nav><header class="hero"><p class="eyebrow">PIXEL ART RESIZER</p><h1>画像をドロップして拡大</h1><p class="lead">x1.5 から x100 まで対応</p></header>
<main class="workspace"><section class="drop-panel"><label class="drop-zone" id="drop-zone" for="file-input"><input id="file-input" type="file" accept="image/*" multiple hidden><span class="drop-kicker">DROP</span><strong>画像を追加</strong><span>ドラッグ&ドロップ または クリック</span></label>
<div class="toolbar"><div class="toolbar-group"><label for="batch-scale">倍率</label><select id="batch-scale"></select><button id="apply-batch" type="button">適用</button></div><div class="toolbar-actions"><button id="download-all" type="button" disabled>保存</button><button id="clear-all" type="button" disabled>クリア</button></div></div><p class="status-text" id="status-text"></p></section>
<section class="gallery-panel"><div class="panel-header"><div><p class="panel-label">IMAGES</p><h2 id="gallery-title">画像なし</h2></div><p class="panel-note" id="gallery-note"></p></div><div class="empty-state" id="empty-state"><strong>画像を追加してください</strong></div><div class="gallery" id="gallery" aria-live="polite"></div></section></main></div>
<template id="card-template"><article class="image-card"><div class="card-top"><div class="card-copy"><p class="card-name"></p><p class="card-info"></p></div><button class="ghost-button" type="button" data-action="remove">削除</button></div><label class="field"><span>倍率</span><select class="scale-select"></select></label><div class="summary-row"><div><span class="summary-label">元画像</span><strong class="source-size"></strong></div><div><span class="summary-label">出力</span><strong class="output-size"></strong></div></div><div class="preview-frame"><canvas class="preview-canvas"></canvas></div><div class="card-actions"><button class="primary-button" type="button" data-action="download">保存</button></div></article></template>
<script type="module" src="./src/main.js"></script></body></html>
