<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F7 / M7 P3 Terminal Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="selectionScreen" class="screen selection-screen">
    <h1>F7 / M7 P3 Terminal</h1>

    <label class="size-control">
      <span>Solver Size</span>
      <input id="sizeRange" type="range" min="70" max="200" step="5" value="100">
      <strong id="sizeValue">100%</strong>
    </label>

    <div class="type-grid">
      <button data-type="numbers">Numbers</button>
      <button data-type="colors">Colors</button>
      <button data-type="startswith">Starts With</button>
      <button data-type="redgreen">Red / Green</button>
      <button data-type="rubix">Rubix</button>
      <button data-type="melody">Melody</button>
    </div>
  </main>

  <main id="gameScreen" class="screen game-screen hidden">
    <h2 id="gameTitle" class="game-title"></h2>
    <div id="grid" class="solver-grid" aria-label="Terminal solver"></div>
    <div id="timer" class="timer">0.000</div>

    <div class="back-row">
      <button id="backButton" class="back-button" type="button">Back</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
