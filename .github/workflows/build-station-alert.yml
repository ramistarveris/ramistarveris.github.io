name: Build Station Alert APK
on:
  push:
    branches: [ "build/station-arrival-alert" ]
    paths:
      - "station-alert/**"
      - ".github/workflows/build-station-alert.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable signing key
        run: base64 -d station-alert/release-key.b64 > station-alert/release-key.jks
      - name: Build signed release APK
        working-directory: station-alert
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp station-alert/app/build/outputs/apk/release/app-release.apk StationArrivalAlert-Auto-v2.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StationArrivalAlert-Auto-v2.1
          path: StationArrivalAlert-Auto-v2.1.apk
