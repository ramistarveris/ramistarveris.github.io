name: Build Station Alert APK
on:
  push:
    branches: [ "build/station-arrival-alert" ]
    paths:
      - "station-alert/**"
      - ".github/workflows/build-station-alert.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: station-alert
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp station-alert/app/build/outputs/apk/debug/app-debug.apk StationArrivalAlert-Pixel9a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StationArrivalAlert-Pixel9a
          path: StationArrivalAlert-Pixel9a.apk
